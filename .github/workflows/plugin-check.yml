name: Plugin engine type check

on:
  workflow_dispatch:
  push:
    branches: [ plugincheck ]

jobs:
  typecheck:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode
        run: |
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer

      - name: Type-check the standalone plugin files against the iOS SDK
        run: |
          set -e
          mkdir -p /tmp/tc
          cp submodules/TelegramCore/Sources/Ghost/GhostPluginRuntime.swift submodules/TelegramCore/Sources/Ghost/GhostPluginPrelude.swift /tmp/tc/
          sed '/^import TelegramCore$/d' submodules/SettingsUI/Sources/GhostPluginsScreen.swift > /tmp/tc/GhostPluginsScreen.swift
          sed '/^import TelegramCore$/d' submodules/TelegramUI/Sources/GhostPluginUI.swift > /tmp/tc/GhostPluginUI.swift
          sed '/^import TelegramCore$/d' submodules/TelegramUI/Sources/GhostRoundVideoPicker.swift > /tmp/tc/GhostRoundVideoPicker.swift
          cp submodules/TelegramUI/Sources/GhostRoundVideoMaker.swift /tmp/tc/
          cp submodules/SettingsUI/Sources/GhostIcons.swift submodules/TelegramCore/Sources/Ghost/GhostSettings.swift /tmp/tc/
          sed '/^import TelegramCore$/d' submodules/SettingsUI/Sources/GhostAutomationsScreen.swift > /tmp/tc/GhostAutomationsScreen.swift
          sed -n '1,/^\/\/ MARK: - Media helpers/p' submodules/TelegramCore/Sources/Ghost/GhostAutomations.swift | sed '/^import Postbox$/d;/^import SwiftSignalKit$/d' > /tmp/tc/GhostAutomationRules.swift
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun swiftc -typecheck -sdk "$SDK" -target arm64-apple-ios15.0 -swift-version 5 -warnings-as-errors /tmp/tc/*.swift
          echo TYPECHECK OK

          mkdir -p /tmp/up
          sed '/^import TelegramCore$/d;/^import SwiftSignalKit$/d' submodules/TelegramUI/Sources/GhostUploadActivityController.swift > /tmp/up/GhostUploadActivityController.swift
          cp .github/ci-stubs/UploadStubs.swift submodules/TelegramCore/Sources/Ghost/GhostSettings.swift /tmp/up/
          xcrun swiftc -typecheck -sdk "$SDK" -target arm64-apple-ios15.0 -swift-version 5 -warnings-as-errors /tmp/up/*.swift
          echo UPLOAD TYPECHECK OK

          mkdir -p /tmp/wg
          cp Telegram/WidgetKitWidget/GhostLiveActivity.swift .github/ci-stubs/WidgetStubs.swift /tmp/wg/
          xcrun swiftc -typecheck -sdk "$SDK" -target arm64-apple-ios15.0 -swift-version 5 -warnings-as-errors -parse-as-library /tmp/wg/*.swift
          echo WIDGET TYPECHECK OK

      - name: Run the prelude in JavaScriptCore
        run: |
          set -e
          cat > /tmp/tc/main.swift <<'SWIFT'
          import Foundation
          import JavaScriptCore
          let context = JSContext()!
          var errors: [String] = []
          context.exceptionHandler = { _, e in errors.append(e?.toString() ?? "?") }
          let native = JSValue(newObjectIn: context)!
          var sent: [String] = []
          let log: @convention(block) (JSValue, JSValue) -> Void = { l, t in print("log", l.toString()!, t.toString()!) }
          let send: @convention(block) (JSValue, JSValue, JSValue) -> Void = { c, t, r in sent.append(t.toString()!) }
          let noop2: @convention(block) (JSValue, JSValue) -> Void = { _, _ in }
          let noop1: @convention(block) (JSValue) -> Void = { _ in }
          let noop3: @convention(block) (JSValue, JSValue, JSValue) -> Void = { _, _, _ in }
          let noop4: @convention(block) (JSValue, JSValue, JSValue, JSValue) -> Void = { _, _, _, _ in }
          let str: @convention(block) () -> String = { "" }
          let get: @convention(block) (JSValue) -> JSValue = { _ in JSValue(nullIn: JSContext.current()) }
          native.setObject(unsafeBitCast(log, to: AnyObject.self), forKeyedSubscript: "log" as NSString)
          native.setObject(unsafeBitCast(send, to: AnyObject.self), forKeyedSubscript: "send" as NSString)
          for n in ["setTimer", "storageSet"] { native.setObject(unsafeBitCast(noop2, to: AnyObject.self), forKeyedSubscript: n as NSString) }
          for n in ["clearTimer", "cancelNotify", "storageRemove"] { native.setObject(unsafeBitCast(noop1, to: AnyObject.self), forKeyedSubscript: n as NSString) }
          native.setObject(unsafeBitCast(noop3, to: AnyObject.self), forKeyedSubscript: "ui" as NSString)
          native.setObject(unsafeBitCast(noop4, to: AnyObject.self), forKeyedSubscript: "notify" as NSString)
          for n in ["storageKeys", "me", "appVersion"] { native.setObject(unsafeBitCast(str, to: AnyObject.self), forKeyedSubscript: n as NSString) }
          native.setObject(unsafeBitCast(get, to: AnyObject.self), forKeyedSubscript: "storageGet" as NSString)
          context.setObject(native, forKeyedSubscript: "__native" as NSString)
          context.evaluateScript(ghostPluginPrelude)
          for file in CommandLine.arguments.dropFirst() {
            context.evaluateScript(try! String(contentsOfFile: file, encoding: .utf8), withSourceURL: URL(fileURLWithPath: file))
          }
          let out = context.objectForKeyedSubscript("__ggOutgoing").call(withArguments: ["{\"chatId\":\"1\",\"chatType\":\"private\",\"chatTitle\":\"t\",\"text\":\".calc 2+2*3\",\"replyTo\":0}"])!.toString()!
          print("calc ->", out)
          let a = context.objectForKeyedSubscript("__ggOutgoing").call(withArguments: ["{\"chatId\":\"1\",\"text\":\".async\",\"replyTo\":0}"])!.toString()!
          print("async ->", a, "sent:", sent)
          print("info ->", context.objectForKeyedSubscript("__ggInfo").call(withArguments: [])!.toString()!)
          print("errors:", errors)
          if !errors.isEmpty || !out.contains("2+2*3 = 8") || !sent.contains("done") { exit(1) }
          print("JSC OK")
          SWIFT
          sed -i '' 's/^          //' /tmp/tc/main.swift
          printf '%s\n' "GG.command('.async', async function(){ return 'done'; });" > /tmp/tc/async.js
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          xcrun swiftc -sdk "$SDK" -o /tmp/tc/jsc_test /tmp/tc/main.swift submodules/TelegramCore/Sources/Ghost/GhostPluginPrelude.swift
          /tmp/tc/jsc_test plugins/*.js /tmp/tc/async.js

      - name: Check the silent Ogg Opus writer
        run: |
          set -e
          mkdir -p /tmp/ogg
          { echo 'import Foundation'; sed -n '/^\/\/\/ Packs bar heights/,$p' submodules/TelegramCore/Sources/Ghost/GhostPluginsBridge.swift; } > /tmp/ogg/ogg.swift
          cat > /tmp/ogg/main.swift <<'SWIFT'
          import Foundation
          try! ghostSilentOggOpus(seconds: 7).write(to: URL(fileURLWithPath: "/tmp/ogg/silent.ogg"))
          let bits = ghostWaveformBitstream([31, 0, 17, 5] + Array(repeating: 9, count: 96))
          print("bitstream bytes", bits.count, Array(bits.prefix(4)))
          SWIFT
          sed -i '' 's/^          //' /tmp/ogg/main.swift
          xcrun swiftc -sdk "$(xcrun --sdk macosx --show-sdk-path)" -o /tmp/ogg/t /tmp/ogg/main.swift /tmp/ogg/ogg.swift
          /tmp/ogg/t
          ls -la /tmp/ogg/silent.ogg
          brew install opus-tools >/dev/null 2>&1 || true
          opusinfo /tmp/ogg/silent.ogg
          opusdec /tmp/ogg/silent.ogg /tmp/ogg/out.wav
          afinfo /tmp/ogg/out.wav | grep -i duration

      - name: Convert video, GIF and picture into round clips on macOS
        run: |
          set -e
          mkdir -p /tmp/rv
          cat > /tmp/rv/main.swift <<'SWIFT'
          import Foundation
          import AVFoundation
          import CoreGraphics
          import ImageIO
          func picture(_ w: Int, _ h: Int, _ r: CGFloat) -> CGImage {
            let c = CGContext(data: nil, width: w, height: h, bitsPerComponent: 8, bytesPerRow: 0, space: CGColorSpaceCreateDeviceRGB(), bitmapInfo: CGImageAlphaInfo.premultipliedFirst.rawValue)!
            c.setFillColor(CGColor(red: r, green: 0.3, blue: 0.8, alpha: 1)); c.fill(CGRect(x: 0, y: 0, width: w, height: h))
            return c.makeImage()!
          }
          func wait(_ run: (@escaping (Result<GhostRoundVideoMaker.Result, Error>) -> Void) -> Void) -> GhostRoundVideoMaker.Result {
            let s = DispatchSemaphore(value: 0); var out: Result<GhostRoundVideoMaker.Result, Error>!
            run { out = $0; s.signal() }; s.wait()
            switch out! { case .success(let r): return r; case .failure(let e): print("FAIL", e); exit(1) }
          }
          func check(_ name: String, _ r: GhostRoundVideoMaker.Result, minDur: Double) {
            let a = AVURLAsset(url: r.url); let t = a.tracks(withMediaType: .video).first!
            let size = t.naturalSize; let d = CMTimeGetSeconds(a.duration)
            let bytes = (try? Data(contentsOf: r.url).count) ?? 0
            print(name, "size", size, "dur", d, "reported", r.duration, "bytes", bytes, "thumb", r.thumbnail != nil)
            if Int(size.width) != 384 || Int(size.height) != 384 || d < minDur || r.thumbnail == nil { print("BAD", name); exit(1) }
          }
          let still = wait { GhostRoundVideoMaker.fromImage(picture(1170, 2532, 0.9), seconds: 5, completion: $0) }
          check("screenshot", still, minDur: 4.5)
          let gifData = NSMutableData()
          let dest = CGImageDestinationCreateWithData(gifData, "com.compuserve.gif" as CFString, 6, nil)!
          for i in 0 ..< 6 { CGImageDestinationAddImage(dest, picture(480, 270, CGFloat(i) / 6), [kCGImagePropertyGIFDictionary: [kCGImagePropertyGIFDelayTime: 0.1]] as CFDictionary) }
          _ = CGImageDestinationFinalize(dest)
          let gif = wait { GhostRoundVideoMaker.fromAnimatedImage(gifData as Data, minSeconds: 3, completion: $0) }
          check("gif", gif, minDur: 2.9)
          // A wide 16:9 clip made from frames, then cropped to a circle-ready square.
          let wideMaker = wait { GhostRoundVideoMaker.fromImage(picture(384, 384, 0.2), seconds: 4, completion: $0) }
          let settings: [String: Any] = [AVVideoCodecKey: AVVideoCodecType.h264, AVVideoWidthKey: 1280, AVVideoHeightKey: 720]
          let wideURL = URL(fileURLWithPath: "/tmp/rv/wide.mp4"); try? FileManager.default.removeItem(at: wideURL)
          let w = try! AVAssetWriter(outputURL: wideURL, fileType: .mp4)
          let input = AVAssetWriterInput(mediaType: .video, outputSettings: settings)
          let ad = AVAssetWriterInputPixelBufferAdaptor(assetWriterInput: input, sourcePixelBufferAttributes: [kCVPixelBufferPixelFormatTypeKey as String: kCVPixelFormatType_32BGRA, kCVPixelBufferWidthKey as String: 1280, kCVPixelBufferHeightKey as String: 720])
          w.add(input); w.startWriting(); w.startSession(atSourceTime: .zero)
          for f in 0 ..< 90 {
            while !input.isReadyForMoreMediaData { Thread.sleep(forTimeInterval: 0.01) }
            var pb: CVPixelBuffer?; CVPixelBufferPoolCreatePixelBuffer(nil, ad.pixelBufferPool!, &pb)
            _ = ad.append(pb!, withPresentationTime: CMTime(value: CMTimeValue(f), timescale: 30))
          }
          input.markAsFinished(); let s2 = DispatchSemaphore(value: 0); w.finishWriting { s2.signal() }; s2.wait()
          _ = wideMaker
          let video = wait { GhostRoundVideoMaker.fromVideo(wideURL, completion: $0) }
          check("video", video, minDur: 2.8)
          print("ROUND OK")
          SWIFT
          sed -i '' 's/^          //' /tmp/rv/main.swift
          xcrun swiftc -sdk "$(xcrun --sdk macosx --show-sdk-path)" -o /tmp/rv/t /tmp/rv/main.swift submodules/TelegramUI/Sources/GhostRoundVideoMaker.swift
          /tmp/rv/t
